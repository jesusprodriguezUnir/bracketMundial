<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <!-- Stadium background -->
  <rect width="640" height="400" fill="#1a1a2e"/>

  <!-- Outer stadium bowl -->
  <ellipse cx="320" cy="220" rx="305" ry="178" fill="#16213e"/>

  <!-- Stands (outer ring) -->
  <ellipse cx="320" cy="220" rx="295" ry="168" fill="#1a2744"/>

  <!-- Track / warm-up area -->
  <ellipse cx="320" cy="220" rx="270" ry="148" fill="#232b3e"/>

  <!-- Field (grass) -->
  <ellipse cx="320" cy="220" rx="245" ry="128" fill="#1d6b1a"/>

  <!-- Grass stripes (alternating) -->
  <ellipse cx="320" cy="220" rx="245" ry="128" fill="none" stroke="#228b1e" stroke-width="18" stroke-dasharray="38 38"/>

  <!-- Field border -->
  <ellipse cx="320" cy="220" rx="244" ry="127" fill="none" stroke="#3aaa30" stroke-width="2.5"/>

  <!-- Center line -->
  <line x1="76" y1="220" x2="564" y2="220" stroke="#3aaa30" stroke-width="2" opacity="0.85"/>

  <!-- Center circle -->
  <ellipse cx="320" cy="220" rx="52" ry="28" fill="none" stroke="#3aaa30" stroke-width="2" opacity="0.85"/>

  <!-- Center spot -->
  <circle cx="320" cy="220" r="3.5" fill="#3aaa30" opacity="0.85"/>

  <!-- Left penalty arc (semi-ellipse approximation) -->
  <path d="M 195 192 Q 175 220 195 248" fill="none" stroke="#3aaa30" stroke-width="1.5" opacity="0.7"/>
  <!-- Left penalty area box -->
  <rect x="76" y="187" width="122" height="66" fill="none" stroke="#3aaa30" stroke-width="1.8" opacity="0.85"/>
  <!-- Left 6-yard box -->
  <rect x="76" y="203" width="44" height="34" fill="none" stroke="#3aaa30" stroke-width="1.5" opacity="0.85"/>
  <!-- Left penalty spot -->
  <circle cx="140" cy="220" r="2.5" fill="#3aaa30" opacity="0.85"/>

  <!-- Right penalty arc -->
  <path d="M 445 192 Q 465 220 445 248" fill="none" stroke="#3aaa30" stroke-width="1.5" opacity="0.7"/>
  <!-- Right penalty area box -->
  <rect x="442" y="187" width="122" height="66" fill="none" stroke="#3aaa30" stroke-width="1.8" opacity="0.85"/>
  <!-- Right 6-yard box -->
  <rect x="520" y="203" width="44" height="34" fill="none" stroke="#3aaa30" stroke-width="1.5" opacity="0.85"/>
  <!-- Right penalty spot -->
  <circle cx="500" cy="220" r="2.5" fill="#3aaa30" opacity="0.85"/>

  <!-- Corner flags -->
  <circle cx="76" cy="187" r="4" fill="none" stroke="#3aaa30" stroke-width="1.5" opacity="0.7"/>
  <circle cx="76" cy="253" r="4" fill="none" stroke="#3aaa30" stroke-width="1.5" opacity="0.7"/>
  <circle cx="564" cy="187" r="4" fill="none" stroke="#3aaa30" stroke-width="1.5" opacity="0.7"/>
  <circle cx="564" cy="253" r="4" fill="none" stroke="#3aaa30" stroke-width="1.5" opacity="0.7"/>

  <!-- Stadium roof segments (top arc) -->
  <path d="M 15 220 Q 50 30 320 15 Q 590 30 625 220" fill="none" stroke="#2a3a6a" stroke-width="18" opacity="0.6"/>
  <path d="M 15 220 Q 50 35 320 20 Q 590 35 625 220" fill="none" stroke="#3a4a7a" stroke-width="6" opacity="0.4"/>

  <!-- Header banner -->
  <rect x="0" y="0" width="640" height="52" fill="rgba(0,0,0,0.55)"/>
  <text x="320" y="33" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#ffd700" letter-spacing="5">FIFA WORLD CUP 2026</text>

  <!-- Bottom banner -->
  <rect x="0" y="365" width="640" height="35" fill="rgba(0,0,0,0.45)"/>
  <text x="320" y="388" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#a0b0d0" letter-spacing="2" opacity="0.9">USA · CANADA · MEXICO</text>
</svg>
