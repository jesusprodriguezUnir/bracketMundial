name: Update Live Scores

on:
  schedule:
    # Cada 5 min — el script tiene skip inteligente:
    # - Si hay partido en ventana [-30min, +3h] → procede.
    # - Si NO hay partido y la última run de auditoría fue hace <1h → salta.
    # Resultado: cuota baja fuera del Mundial, frescura alta durante partidos.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignorar skip inteligente (--force)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Validar secrets requeridos
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY || vars.API_FOOTBALL_KEY || secrets.RAPIDAPI_KEY || vars.RAPIDAPI_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || vars.SUPABASE_SERVICE_KEY }}
        run: |
          missing=0
          [ -z "$API_FOOTBALL_KEY" ] && { echo "❌ Falta API_FOOTBALL_KEY"; missing=1; }
          [ -z "$VITE_SUPABASE_URL" ] && { echo "❌ Falta VITE_SUPABASE_URL"; missing=1; }
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && { echo "❌ Falta SUPABASE_SERVICE_ROLE_KEY"; missing=1; }
          [ "$missing" -eq 1 ] && exit 1
          echo "✅ Secrets OK"

      - name: Ejecutar update-live-scores
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY || vars.API_FOOTBALL_KEY || secrets.RAPIDAPI_KEY || vars.RAPIDAPI_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || vars.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          npm run scores:update -- $ARGS
