name: Update odds feed

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate odds feed
        run: npx tsx scripts/generate-odds.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Detect feed changes
        id: detect
        run: |
          git fetch origin odds-data 2>/dev/null || true
          REMOTE_HASH=$(git show origin/odds-data:odds-feed.json 2>/dev/null | sha256sum | cut -d' ' -f1 || echo "none")
          LOCAL_HASH=$(sha256sum odds-feed.json | cut -d' ' -f1)

          if [ "$REMOTE_HASH" = "$LOCAL_HASH" ]; then
            echo "No changes in odds feed — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Purge MUST run while main is still checked out. After the orphan
      # checkout the scripts/ tree is gone (this was failing the job twice a day).
      - name: Purge Cloudflare cache (shell PWA)
        if: steps.detect.outputs.changed == 'true'
        continue-on-error: true
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ ! -f scripts/purge-cloudflare-cache.mjs ]; then
            echo "skip purge: script not in working tree"
            exit 0
          fi
          node scripts/purge-cloudflare-cache.mjs \
            https://bracketmundial.com/ \
            https://bracketmundial.com/index.html \
            https://bracketmundial.com/sw.js \
            https://bracketmundial.com/registerSW.js \
            https://bracketmundial.com/manifest.webmanifest

      - name: Publish to odds-data branch
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp odds-feed.json /tmp/odds-feed.json
          cp ucl-odds-feed.json /tmp/ucl-odds-feed.json 2>/dev/null || cp odds-feed.json /tmp/ucl-odds-feed.json

          git checkout --orphan odds-data-tmp
          git rm -rf . --quiet
          cp /tmp/odds-feed.json odds-feed.json
          cp /tmp/ucl-odds-feed.json ucl-odds-feed.json
          echo '{
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "installCommand": "true",
            "buildCommand": "true",
            "git": {
              "deploymentEnabled": {
                "odds-data": false
              }
            }
          }' > vercel.json
          git add odds-feed.json ucl-odds-feed.json vercel.json
          git commit -m "chore: update odds feed $(date -u +%Y-%m-%d)"
          git push origin odds-data-tmp:odds-data --force
          echo "✅ odds-data branch updated."
