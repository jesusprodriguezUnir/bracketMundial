name: Ingest news to Supabase

on:
  schedule:
    # Cada 3 h durante el Mundial; el script tiene skip inteligente que evita
    # llamar a APIs si la última ingesta fue hace <1 h. Fuera del Mundial,
    # con 8 runs/día y skip activo, gasta ~1-2 runs reales.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      teams:
        description: 'Equipos a refrescar (ej: ARG MEX). Vacío = todos.'
        required: false
        default: ''
      force:
        description: 'Ignorar skip de 1h (--force)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: ingest-news
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Validar secrets requeridos
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || vars.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "❌ Faltan VITE_SUPABASE_URL y/o SUPABASE_SERVICE_ROLE_KEY en GitHub Secrets."
            echo "   El script puede correr en modo --json-only pero no es lo que queremos en CI."
            exit 1
          fi
          echo "✅ Supabase configurado."

      - name: Ingest news
        env:
          GNEWS_DATA_KEY: ${{ secrets.GNEWS_DATA_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || vars.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.teams }}" ]; then
            ARGS="$ARGS ${{ inputs.teams }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          node scripts/ingest-news.mjs $ARGS

      - name: Purge Cloudflare cache (shell PWA)
        if: success()
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          node scripts/purge-cloudflare-cache.mjs \
            https://bracketmundial.com/ \
            https://bracketmundial.com/index.html \
            https://bracketmundial.com/sw.js \
            https://bracketmundial.com/registerSW.js \
            https://bracketmundial.com/manifest.webmanifest
