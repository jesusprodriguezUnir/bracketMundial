<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebPersonal — 3 direcciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: #1a1a1c; }
    body { font-family: Inter, -apple-system, sans-serif; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="designs/direction-1-editorial.jsx"></script>
  <script type="text/babel" src="designs/direction-2-terminal.jsx"></script>
  <script type="text/babel" src="designs/direction-3-character.jsx"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useState } = React;

    function App() {
      // Wait until all design components are loaded onto window
      const [ready, setReady] = useState(false);
      useEffect(() => {
        const tick = () => {
          if (window.EditorialDesign && window.TerminalDesign && window.CharacterDesign && window.DesignCanvas) {
            setReady(true);
          } else {
            setTimeout(tick, 50);
          }
        };
        tick();
      }, []);
      if (!ready) return null;

      const W = 1280;
      const H = 2680;

      return (
        <DesignCanvas>
          <DCSection
            id="home"
            title="Home · WebPersonal"
            subtitle="3 direcciones para jesusrodriguez.dev — cada una un sistema completo (nav, hero, stats, proyectos, blog, CTA, footer)"
          >
            <DCArtboard id="editorial" label="01 · Editorial Minimal" width={W} height={H}>
              <window.EditorialDesign />
            </DCArtboard>
            <DCArtboard id="terminal" label="02 · Dev Terminal" width={W} height={H}>
              <window.TerminalDesign />
            </DCArtboard>
            <DCArtboard id="character" label="03 · Tech con Carácter" width={W} height={H}>
              <window.CharacterDesign />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
